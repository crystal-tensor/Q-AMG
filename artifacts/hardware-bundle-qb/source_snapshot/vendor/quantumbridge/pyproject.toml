[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumbridge-sdk"
version = "0.1.0rc1"
description = "Experimental QuantumBridge SDK P1 release-candidate subset with optional Qiskit and PennyLane compatibility adapters."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
  {name = "QuantumBridge Contributors"}
]
keywords = ["quantum", "sdk", "simulator", "experimental"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
  "numpy>=1.20"
]

[project.optional-dependencies]
qiskit = ["qiskit"]
qiskit-core = ["qiskit"]
qiskit-aer = ["qiskit-aer"]
qiskit-runtime = ["qiskit-ibm-runtime"]
qiskit-nature = ["qiskit-nature", "qiskit-algorithms", "pyscf"]
qiskit-algorithms = ["qiskit-algorithms"]
qiskit-finance = ["qiskit-finance"]
finance-apps = ["dimod>=0.12.22,<0.13", "scipy>=1.10", "pennylane>=0.42,<0.45", "torch>=2"]
qiskit-optimization = ["qiskit-optimization"]
qiskit-machine-learning = ["qiskit-machine-learning"]
qiskit-dynamics = ["qiskit-dynamics"]
qiskit-experiments = ["qiskit-experiments"]
qiskit-metal = ["qiskit-metal"]
qiskit-addons = [
  "qiskit-addon-sqd",
  "qiskit-addon-mpf",
  "qiskit-addon-aqc-tensor",
  "qiskit-addon-obp"
]
pennylane = ["pennylane", "autoray<0.8"]
pennylane-full = ["pennylane", "autoray<0.8"]
ecosystem-qiskit = [
  "qiskit",
  "qiskit-aer",
  "qiskit-finance",
  "qiskit-optimization",
  "qiskit-machine-learning"
]
ecosystem-chemistry = [
  "qiskit-nature",
  "qiskit-algorithms",
  "pyscf",
  "openfermion"
]
ecosystem-pennylane = ["pennylane", "autoray<0.8"]
chemistry = [
  "numpy>=2,<3",
  "qiskit-nature==0.8.0",
  "qiskit-algorithms==0.4.0",
  "pyscf==2.13.1",
  "openfermion==1.7.1"
]
chemistry-compatible = [
  "numpy>=2,<3",
  "qiskit-nature==0.8.0",
  "qiskit-algorithms==0.4.0",
  "pyscf==2.13.1",
  "openfermion==1.7.1"
]
chemistry-numpy2 = [
  "numpy>=2,<3",
  "qiskit-nature==0.8.0",
  "qiskit-algorithms==0.4.0",
  "pyscf==2.13.1",
  "openfermion==1.7.1"
]
algorithms = ["qiskit-algorithms==0.4.0"]
openfermion = ["numpy>=2,<3", "openfermion==1.7.1"]
pyscf = ["pyscf==2.13.1"]
quafu = ["pyquafu==0.4.5", "numpy<2.0.0"]
quafu-compatible = ["pyquafu==0.4.5", "numpy<2.0.0"]
quafu-cloud = [
  "quarkstudio>=7.3.9; python_version >= '3.12'",
  "quarkcircuit>=0.5.13; python_version >= '3.12'"
]
torch = ["torch"]
jax = ["jax", "jaxlib"]
tensorflow = ["tensorflow"]
dev = ["pytest", "numpy", "pytest-cov"]

[tool.setuptools]
packages = {find = {include = ["quantumbridge*"]}}

[tool.setuptools.package-data]
"quantumbridge.finance" = ["data/*.csv", "data/*.json", "data/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "slow: installed-environment smoke tests that may touch larger optional upstream dependencies"
]
