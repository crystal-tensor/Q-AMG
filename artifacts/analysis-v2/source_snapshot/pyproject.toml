[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qmech"
version = "0.1.0"
description = "Quantum/classical hierarchical mechanical generation research prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "qiskit>=2.1,<3",
  "qiskit-aer>=0.17,<0.19",
  "cadquery>=2.6,<2.9",
  "trimesh>=4.6,<5",
  "ortools>=9.12,<10",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "torch==2.12.0",
]

[project.scripts]
qmech = "qmech.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-timeout>=2.3,<3", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/qmech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
line-length = 100

